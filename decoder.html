<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beacon Decoder — Which Zone</title>
<style>
  :root{ color-scheme:dark; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:#0d1117; color:#e6edf3; font:16px/1.5 -apple-system,system-ui,Segoe UI,Roboto,sans-serif; }
  header{ padding:16px; background:#11161d; border-bottom:1px solid #222c37; }
  h1{ font-size:18px; margin:0 0 4px; } header p{ margin:0; color:#9aa7b4; font-size:13px; }
  main{ padding:16px; max-width:640px; margin:0 auto; }
  .btn{ width:100%; padding:16px; font-size:18px; font-weight:600; border:0; border-radius:12px; background:#2f81f7; color:#fff; }
  .card{ background:#11161d; border:1px solid #222c37; border-radius:12px; padding:16px; margin-top:14px; }
  .hero{ text-align:center; }
  .hero .lab{ color:#9aa7b4; font-size:12px; text-transform:uppercase; letter-spacing:.12em; }
  .hero .zone{ font-size:34px; font-weight:700; line-height:1.15; margin-top:4px; }
  .hero .zone.on{ color:#3fb950; } .hero .zone.off{ color:#6e7d8a; }
  .bar{ margin-top:12px; }
  .bar .top{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px; }
  .bar .track{ height:14px; background:#0a0e14; border:1px solid #222c37; border-radius:8px; overflow:hidden; }
  .bar .fill{ height:100%; width:0; transition:width .12s linear; border-radius:8px; }
  .bar.win .name{ font-weight:700; }
  .meta{ display:flex; justify-content:space-between; color:#9aa7b4; font-size:13px; margin-top:12px; }
  .mono{ font-variant-numeric:tabular-nums; }
  textarea{ width:100%; height:120px; margin-top:10px; background:#0a0e14; color:#c9d5e1; border:1px solid #222c37;
            border-radius:10px; padding:10px; font:12px/1.4 ui-monospace,Menlo,monospace; }
  .btn2{ padding:9px 14px; font-size:14px; font-weight:600; border:0; border-radius:9px; background:#238636; color:#fff; }
  code{ background:#0a0e14; padding:1px 5px; border-radius:5px; }
  .row{ display:flex; justify-content:space-between; align-items:center; }
</style>
</head>
<body>
<header>
  <h1>Which zone am I in?</h1>
  <p>Listens for the beacons and shows the nearest (loudest) one.</p>
</header>
<main>
  <button id="start" class="btn">Start (allow microphone)</button>
  <div id="err" class="card" hidden style="border-color:#5a1d1d"></div>

  <div id="live" hidden>
    <div class="card hero">
      <div class="lab">You are near</div>
      <div id="zone" class="zone off">— searching —</div>
    </div>
    <div class="card" id="bars"></div>
    <div class="card">
      <div class="row"><b>Log</b><button id="copy" class="btn2">Copy</button></div>
      <div class="meta"><span>Sample rate: <b id="sr" class="mono">—</b></span><span>Noise floor: <b id="floor" class="mono">—</b></span></div>
      <textarea id="log" readonly></textarea>
    </div>
  </div>
</main>

<script>
/* ---- Beacons: must match the ESP32 firmware (BEACON_FREQ). Add more here as you add beacons. ---- */
const BEACONS = [
  { id:"Z1", name:"Zone 1", freq:18000, color:"#3fb950" },
  { id:"Z2", name:"Zone 2", freq:19000, color:"#d29922" },
];
const PROMINENCE = 12;   // dB a tone must stand above the noise floor to count
const ABS_FLOOR  = -95;
const LEAD_DB    = 3;    // winner must lead the runner-up by this much (anti-flicker)

let analyser, freqData, srHz, binHz, curZone=null;
const $ = id => document.getElementById(id);
const lines=[]; const t0=performance.now();
function log(m){ lines.push('['+((performance.now()-t0)/1000).toFixed(1)+'s] '+m); $('log').value=lines.join('\n'); $('log').scrollTop=1e9; }

$('copy').addEventListener('click', ()=>{ const t=lines.join('\n');
  (navigator.clipboard?.writeText(t) || Promise.reject()).then(()=>{$('copy').textContent='Copied ✓';setTimeout(()=>$('copy').textContent='Copy',1200);})
  .catch(()=>{$('log').select();}); });

$('start').addEventListener('click', async ()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{noiseSuppression:false,echoCancellation:false,autoGainControl:false,channelCount:1},video:false});
    const ctx=new (window.AudioContext||window.webkitAudioContext)(); await ctx.resume();
    srHz=ctx.sampleRate; $('sr').textContent=(srHz/1000).toFixed(1)+' kHz';
    const src=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser(); analyser.fftSize=8192; analyser.smoothingTimeConstant=0.5;
    binHz=srHz/analyser.fftSize; freqData=new Float32Array(analyser.frequencyBinCount); src.connect(analyser);
    log('mic granted, sampleRate '+srHz);
    $('start').hidden=true; $('live').hidden=false; buildBars(); loop();
  }catch(e){ const b=$('err'); b.hidden=false;
    b.innerHTML='<b>Could not start:</b> '+(e&&e.message?e.message:e)+'<br><span style="color:#9aa7b4">Open over <code>https://</code> and allow the microphone.</span>'; }
});

function buildBars(){
  $('bars').innerHTML = BEACONS.map(b=>
    `<div class="bar" id="bar-${b.id}">
       <div class="top"><span class="name">${b.name} · ${(b.freq/1000).toFixed(1)} kHz</span><span class="mono" id="db-${b.id}">—</span></div>
       <div class="track"><div class="fill" id="fill-${b.id}" style="background:${b.color}"></div></div>
     </div>`).join('');
}
function median(){ const lo=Math.floor(14000/binHz),hi=Math.min(freqData.length-1,Math.ceil(22000/binHz));
  const a=[]; for(let i=lo;i<=hi;i++)a.push(freqData[i]); a.sort((x,y)=>x-y); return a[Math.floor(a.length*0.5)]; }
function peak(f){ const h=120,lo=Math.max(0,Math.floor((f-h)/binHz)),hi=Math.min(freqData.length-1,Math.ceil((f+h)/binHz));
  let m=-140; for(let i=lo;i<=hi;i++) if(freqData[i]>m)m=freqData[i]; return m; }

function loop(){
  analyser.getFloatFrequencyData(freqData);
  const floor=median(); $('floor').textContent=floor.toFixed(0)+' dB';

  let best=null, bestDb=-999, second=-999;
  for(const b of BEACONS){
    const db=peak(b.freq);
    const present=(db>floor+PROMINENCE)&&(db>ABS_FLOOR);
    // bar: map (floor .. floor+50) -> 0..100%
    const pct=Math.max(0,Math.min(100, (db-floor)/50*100));
    $('fill-'+b.id).style.width = pct+'%';
    $('db-'+b.id).textContent = present ? db.toFixed(0)+' dB' : 'quiet';
    $('bar-'+b.id).classList.remove('win');
    if(present){ if(db>bestDb){ second=bestDb; best=b; bestDb=db; } else if(db>second){ second=db; } }
  }

  let zoneEl=$('zone');
  if(best && (bestDb-second>=LEAD_DB || second<=-900)){
    if(curZone!==best.id){ curZone=best.id; log('NEAR '+best.name+' ('+bestDb.toFixed(0)+' dB)'); }
    zoneEl.textContent=best.name; zoneEl.className='zone on';
    $('bar-'+best.id).classList.add('win');
  } else if(!best){
    if(curZone!==null){ curZone=null; log('no beacon heard'); }
    zoneEl.textContent='— searching —'; zoneEl.className='zone off';
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
