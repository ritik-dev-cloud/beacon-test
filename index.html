<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultrasonic Hearing Test — Bharat Mandapam spike</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #0d1117; color: #e6edf3;
         font: 16px/1.5 -apple-system, system-ui, Segoe UI, Roboto, sans-serif; }
  header { padding: 16px; background: #11161d; border-bottom: 1px solid #222c37; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  header p { margin: 0; color: #9aa7b4; font-size: 13px; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }
  button { width: 100%; padding: 16px; font-size: 18px; font-weight: 600;
           border: 0; border-radius: 12px; background: #2f81f7; color: #fff; }
  button:disabled { background: #30363d; color: #8b949e; }
  .card { background: #11161d; border: 1px solid #222c37; border-radius: 12px;
          padding: 14px; margin-top: 14px; }
  .big { font-size: 30px; font-weight: 700; }
  .muted { color: #9aa7b4; font-size: 13px; }
  canvas { width: 100%; height: 190px; display: block; background: #0a0e14;
           border-radius: 10px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  td { padding: 8px 6px; border-top: 1px solid #1c2530; font-variant-numeric: tabular-nums; }
  td:last-child { text-align: right; font-weight: 600; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .ok  { background: #113a2a; color: #3fb950; }
  .weak{ background: #3a3411; color: #d29922; }
  .no  { background: #3a1d1d; color: #f85149; }
  code { background: #0a0e14; padding: 1px 5px; border-radius: 5px; }
  .row { display: flex; justify-content: space-between; gap: 12px; }
</style>
</head>
<body>
<header>
  <h1>Ultrasonic hearing test</h1>
  <p>Play the ESP32 tone staircase near this phone, then read the highest tone it detects.</p>
</header>
<main>
  <button id="start">Start the test (allow microphone)</button>
  <div id="err" class="card" hidden style="border-color:#5a1d1d"></div>

  <div class="card">
    <div class="muted">Highest tone this phone reliably detects</div>
    <div id="ceiling" class="big">— kHz</div>
    <div class="row" style="margin-top:8px">
      <span class="muted">Live peak (15–22 kHz): <b id="peak">—</b></span>
      <span class="muted">Mic sample rate: <b id="sr">—</b></span>
    </div>
  </div>

  <canvas id="spec" width="700" height="190"></canvas>

  <div class="card">
    <div class="muted" style="margin-bottom:4px">Per-tone detection (updates live)</div>
    <table id="bands"></table>
  </div>

  <div class="card">
    <div class="muted">Applied microphone settings <span id="proc"></span></div>
    <div id="settings" class="muted" style="margin-top:6px; word-break:break-word">—</div>
  </div>
</main>

<script>
const TARGETS = [17000,17500,18000,18500,19000,19500,20000];
const DETECT_DB = -78;   // above this = clearly present
const WEAK_DB   = -85;   // above this = marginal
let audioCtx, analyser, freqData, srHz, binHz, running = false;
let everSeen = {};       // freq -> best dB seen this session
TARGETS.forEach(f => everSeen[f] = -140);

const $ = id => document.getElementById(id);

$('start').addEventListener('click', async () => {
  try {
    // 1) mic with all phone DSP requested OFF (we want the raw ultrasonic energy)
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { noiseSuppression:false, echoCancellation:false,
               autoGainControl:false, channelCount:1 }, video:false });

    // 2) AudioContext must be created + resumed inside this tap (iOS rule)
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    srHz = audioCtx.sampleRate;
    $('sr').textContent = (srHz/1000).toFixed(1) + ' kHz';

    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 8192;                 // ~5.9 Hz per bin @ 48 kHz
    analyser.smoothingTimeConstant = 0.3;
    binHz = srHz / analyser.fftSize;
    freqData = new Float32Array(analyser.frequencyBinCount);
    src.connect(analyser);

    // report what the browser actually applied
    const st = stream.getAudioTracks()[0].getSettings();
    $('settings').textContent = JSON.stringify(st);
    const off = ('noiseSuppression' in st) &&
                !st.noiseSuppression && !st.echoCancellation && !st.autoGainControl;
    $('proc').innerHTML = off ? '<span class="pill ok">DSP off</span>'
                              : '<span class="pill weak">DSP may still be on</span>';

    $('start').disabled = true;
    $('start').textContent = 'Listening…';
    running = true;
    buildTable();
    loop();
  } catch (e) {
    const box = $('err'); box.hidden = false;
    box.innerHTML = '<b>Could not start:</b> ' + (e && e.message ? e.message : e) +
      '<br><span class="muted">Must be opened over <code>https://</code>, and microphone must be allowed.</span>';
  }
});

function dbAround(freq, halfHz) {
  const lo = Math.max(0, Math.floor((freq-halfHz)/binHz));
  const hi = Math.min(freqData.length-1, Math.ceil((freq+halfHz)/binHz));
  let m = -140; for (let i=lo;i<=hi;i++) if (freqData[i] > m) m = freqData[i];
  return m;
}
function classDb(db){ return db>=DETECT_DB?'ok':db>=WEAK_DB?'weak':'no'; }
function labelDb(db){ return db>=DETECT_DB?'detected':db>=WEAK_DB?'weak':'not heard'; }

function buildTable(){
  $('bands').innerHTML = TARGETS.map(f =>
    `<tr><td>${(f/1000).toFixed(1)} kHz</td>
         <td id="v-${f}"><span class="pill no">—</span></td></tr>`).join('');
}

const canvas = $('spec'), ctx = canvas.getContext('2d');
function loop(){
  if (!running) return;
  analyser.getFloatFrequencyData(freqData);

  // live peak in 15-22 kHz
  let peakDb=-140, peakHz=0;
  const lo=Math.floor(15000/binHz), hi=Math.min(freqData.length-1,Math.ceil(22000/binHz));
  for (let i=lo;i<=hi;i++) if (freqData[i]>peakDb){peakDb=freqData[i];peakHz=i*binHz;}
  $('peak').textContent = peakDb>-110 ? (peakHz/1000).toFixed(2)+' kHz ('+peakDb.toFixed(0)+' dB)' : '—';

  // per-target bands + track highest ever detected
  let ceiling = 0;
  for (const f of TARGETS){
    const db = dbAround(f, 120);
    if (db > everSeen[f]) everSeen[f] = db;
    if (everSeen[f] >= DETECT_DB) ceiling = Math.max(ceiling, f);
    const cell = $('v-'+f);
    if (cell) cell.innerHTML = `<span class="pill ${classDb(db)}">${labelDb(db)} ${db>-110?db.toFixed(0)+' dB':''}</span>`;
  }
  $('ceiling').textContent = ceiling ? (ceiling/1000).toFixed(1)+' kHz' : '— kHz';

  drawSpectrum();
  requestAnimationFrame(loop);
}

function drawSpectrum(){
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const fMin=14000, fMax=22000;
  const x = f => (f-fMin)/(fMax-fMin)*W;
  const y = db => H - Math.max(0, Math.min(1,(db+120)/90))*H;
  // gridlines at each target
  ctx.font='11px sans-serif';
  for (const f of TARGETS){
    ctx.strokeStyle='#1c2530'; ctx.beginPath(); ctx.moveTo(x(f),0); ctx.lineTo(x(f),H); ctx.stroke();
    ctx.fillStyle='#5b6773'; ctx.fillText((f/1000).toFixed(1), x(f)-8, H-4);
  }
  // threshold line
  ctx.strokeStyle='#3fb95055'; ctx.beginPath(); ctx.moveTo(0,y(DETECT_DB)); ctx.lineTo(W,y(DETECT_DB)); ctx.stroke();
  // spectrum curve
  ctx.strokeStyle='#2f81f7'; ctx.lineWidth=2; ctx.beginPath();
  const lo=Math.floor(fMin/binHz), hi=Math.min(freqData.length-1,Math.ceil(fMax/binHz));
  let first=true;
  for (let i=lo;i<=hi;i++){ const px=x(i*binHz), py=y(freqData[i]);
    if(first){ctx.moveTo(px,py);first=false;} else ctx.lineTo(px,py); }
  ctx.stroke();
}
</script>
</body>
</html>
